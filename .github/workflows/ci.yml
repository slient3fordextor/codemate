name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -c requirements.lock -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unified checks including clean wheel installation
        run: make check PYTHON=python

  safety:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Bubblewrap and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          python -m pip install -c requirements.lock -e ".[dev]"
      - name: Real safety integration tests (no sandbox skips)
        run: make test-safety PYTHON=python
