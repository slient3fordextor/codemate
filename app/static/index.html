<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CodeMate CLI Chat</title>
    <meta
      name="description"
      content="CodeMate 本地 CLI 开发对话界面，用于分析任务、命令输出和终端报错。"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#messageInput">跳到输入框</a>
    <main class="shell" aria-label="CodeMate CLI Chat">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">CM</span>
          <div>
            <h1>CodeMate</h1>
            <p>本地 CLI 开发对话</p>
          </div>
        </div>
        <div class="session-meta" aria-label="会话状态">
          <span>FastAPI</span>
          <span>SSE stream</span>
        </div>
        <div class="status" id="connectionStatus">就绪</div>
      </header>

      <dialog class="model-panel" id="modelPanel" aria-label="模型配置">
        <div class="model-modal">
          <div class="model-sidebar">
            <div>
              <p class="eyebrow">models</p>
              <h2>模型列表</h2>
            </div>
            <input
              class="model-search"
              id="modelSearchInput"
              type="search"
              placeholder="搜索模型或供应商"
              autocomplete="off"
            />
            <div class="model-list" id="modelPresetList" aria-label="模型列表"></div>
          </div>
          <form class="model-form" id="modelConfigForm">
            <div class="model-form-head">
              <div>
                <p class="eyebrow">config</p>
                <h2>连接参数</h2>
              </div>
              <button type="button" class="secondary model-close" id="modelCloseButton">关闭</button>
            </div>
            <label>
              Provider
              <select id="modelProvider">
                <option value="mock">mock</option>
                <option value="openai_compatible">openai_compatible</option>
                <option value="anthropic">anthropic</option>
                <option value="claude">claude</option>
                <option value="ollama">ollama</option>
                <option value="deepseek">deepseek</option>
                <option value="qwen">qwen</option>
                <option value="zhipu">zhipu</option>
                <option value="moonshot">moonshot</option>
                <option value="baichuan">baichuan</option>
              </select>
            </label>
            <label>
              Base URL
              <input id="modelBaseUrl" type="url" placeholder="https://api.example.com/v1" />
            </label>
            <label>
              Model
              <input id="modelName" type="text" value="mock-model" placeholder="deepseek-chat" required />
            </label>
            <label>
              API Key
              <input id="modelApiKey" type="password" placeholder="留空则保留后端已有密钥" />
            </label>
            <label class="model-note-field">
              Note
              <textarea id="modelNote" rows="3" placeholder="给这个模型写一个备注，例如：日常代码审查 / 本地测试 / 低成本问答"></textarea>
            </label>
            <label>
              Temperature
              <input id="modelTemperature" type="number" min="0" max="2" step="0.1" placeholder="可选" />
            </label>
            <label>
              Max Tokens
              <input id="modelMaxTokens" type="number" min="1" step="1" placeholder="可选" />
            </label>
            <label>
              Timeout
              <input id="modelTimeout" type="number" min="1" step="1" value="60" />
            </label>
            <label>
              Retries
              <input id="modelRetries" type="number" min="0" step="1" value="2" />
            </label>
            <label>
              Context Window
              <input id="modelContextWindow" type="number" min="1" step="1" value="32768" />
            </label>
            <div class="model-actions">
              <label class="inline-check">
                <input id="clearApiKey" type="checkbox" />
                清空 API Key
              </label>
              <span class="model-key-state" id="modelKeyState">未读取</span>
              <button type="submit">保存模型</button>
            </div>
          </form>
        </div>
      </dialog>

      <section class="brief-panel" aria-label="当前工作台">
        <div class="brief-copy">
          <p class="eyebrow">workspace</p>
          <p>当前文件、选中片段和终端输出会组成一次可追踪的开发上下文。</p>
        </div>
        <div class="brief-flow" aria-label="工作流">
          <span><b>01</b> context</span>
          <span><b>02</b> command</span>
          <span><b>03</b> verify</span>
        </div>
      </section>

      <section class="context-panel" aria-label="上下文">
        <label>
          当前文件
          <input id="currentFile" type="text" placeholder="例如 app/main.py" autocomplete="off" />
        </label>
        <label>
          选中文本
          <textarea id="selectedText" rows="2" placeholder="可粘贴当前选中的代码片段"></textarea>
        </label>
      </section>

      <section class="messages" id="messages" aria-live="polite" aria-label="消息">
        <article class="message assistant">
          <div class="avatar">AI</div>
          <div class="bubble">
            <p>把你要完成的 CLI 开发任务、终端报错或测试输出发给我。我会优先给出可复制命令、原因和下一步验证方式。</p>
          </div>
        </article>
      </section>

      <form class="composer" id="chatForm" aria-label="发送消息">
        <label class="message-label" for="messageInput">消息</label>
        <textarea
          id="messageInput"
          rows="4"
          placeholder="描述任务，或粘贴 pytest / uvicorn / npm / git 报错..."
          required
        ></textarea>
        <div class="composer-actions">
          <select
            class="composer-mode"
            id="operationModeSelect"
            aria-label="选择操作模式"
            title="当前 Web 页面仅提供对话；受控 Agent 执行请使用 codemate CLI"
          >
            <option value="chat">对话</option>
          </select>
          <select class="composer-model" id="composerModelSelect" aria-label="选择模型"></select>
          <p class="send-hint">Ctrl/⌘ + Enter</p>
          <button type="button" class="secondary icon-button" id="newSessionButton" aria-label="新会话">+</button>
          <button type="submit" class="icon-button" id="sendButton" aria-label="发送">➤</button>
        </div>
      </form>
    </main>

    <script src="/static/app.js?v=20260707-restore-main-selects" type="module"></script>
  </body>
</html>
