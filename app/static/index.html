<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CodeMate CLI Chat</title>
    <meta
      name="description"
      content="CodeMate 本地 CLI 开发对话界面，用于分析任务、命令输出和终端报错。"
    />
    <script src="/static/theme.js"></script>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#messageInput">跳到输入框</a>
    <main class="shell" aria-label="CodeMate CLI Chat">
      <aside class="app-sidebar" aria-label="主导航">
        <div class="sidebar-brand">
          <span class="brand-mark" aria-hidden="true">CM</span>
          <div>
            <strong>CodeMate</strong>
            <span>developer workspace</span>
          </div>
        </div>
        <button class="sidebar-new-task" id="newSessionSidebarButton" type="button">
          <span aria-hidden="true">+</span>
          新建任务
        </button>
        <nav class="sidebar-nav" aria-label="工作区导航">
          <p class="sidebar-label">工作区</p>
          <a class="sidebar-link active" href="#messages" aria-current="page">
            <span class="nav-icon" aria-hidden="true">◈</span>
            当前对话
          </a>
        </nav>
        <div class="task-history">
          <div class="task-history-head">
            <p class="sidebar-label">最近任务</p>
          <span class="task-count" id="taskCount">1</span>
          </div>
          <div id="taskHistoryList">
            <button class="task-item active" type="button">
              <span class="task-status" aria-hidden="true"></span>
              <span><strong>当前对话</strong><small>刚刚开始</small></span>
            </button>
          </div>
        </div>
        <div class="sidebar-footer">
          <button class="sidebar-settings" id="modelSettingsButton" type="button" aria-label="打开设置" title="设置">
            <span aria-hidden="true">⚙</span>
          </button>
        </div>
      </aside>

      <section class="workspace is-empty" aria-label="主要工作区">
      <dialog class="model-panel" id="modelPanel" aria-label="模型配置">
        <div class="model-modal">
          <div class="model-sidebar">
            <div>
              <p class="eyebrow">models</p>
              <h2>模型列表</h2>
            </div>
          <input
            class="model-search"
              id="modelSearchInput"
              type="search"
              placeholder="搜索模型或供应商"
              autocomplete="off"
            />
            <div class="model-list" id="modelPresetList" aria-label="模型列表"></div>
            <section class="theme-picker" aria-label="切换皮肤">
              <p class="sidebar-label">外观</p>
              <div class="theme-options">
                <button type="button" data-theme-choice="princess" aria-pressed="true"><span class="theme-swatch princess" aria-hidden="true"></span>梦幻公主粉</button>
                <button type="button" data-theme-choice="starry" aria-pressed="false"><span class="theme-swatch starry" aria-hidden="true"></span>星空玻璃</button>
              </div>
            </section>
            <section class="archive-panel" aria-label="归档任务">
              <div class="archive-panel-head">
                <p class="sidebar-label">归档任务</p>
                <span class="task-count" id="archivedCount">0</span>
              </div>
              <div class="archive-list" id="archiveList"></div>
              <p class="archive-empty" id="archiveEmpty">暂无归档任务</p>
            </section>
          </div>
          <form class="model-form" id="modelConfigForm">
            <div class="model-form-head">
              <div>
                <p class="eyebrow">config</p>
                <h2>连接参数</h2>
              </div>
              <button type="button" class="secondary model-close" id="modelCloseButton">关闭</button>
            </div>
            <label>
              Provider
              <select id="modelProvider">
                <option value="mock">mock</option>
                <option value="openai_compatible">openai_compatible</option>
                <option value="anthropic">anthropic</option>
                <option value="claude">claude</option>
                <option value="ollama">ollama</option>
                <option value="deepseek">deepseek</option>
                <option value="qwen">qwen</option>
                <option value="zhipu">zhipu</option>
                <option value="moonshot">moonshot</option>
                <option value="baichuan">baichuan</option>
              </select>
            </label>
            <label>
              Base URL
              <input id="modelBaseUrl" type="url" placeholder="https://api.example.com/v1" />
            </label>
            <label>
              Model
              <input id="modelName" type="text" value="mock-model" placeholder="deepseek-chat" required />
            </label>
            <label>
              API Key
              <input id="modelApiKey" type="password" placeholder="留空则保留后端已有密钥" />
            </label>
            <label class="model-note-field">
              Note
              <textarea id="modelNote" rows="3" placeholder="给这个模型写一个备注，例如：日常代码审查 / 本地测试 / 低成本问答"></textarea>
            </label>
            <label>
              Temperature
              <input id="modelTemperature" type="number" min="0" max="2" step="0.1" placeholder="可选" />
            </label>
            <label>
              Max Tokens
              <input id="modelMaxTokens" type="number" min="1" step="1" placeholder="可选" />
            </label>
            <label>
              Timeout
              <input id="modelTimeout" type="number" min="1" step="1" value="60" />
            </label>
            <label>
              Retries
              <input id="modelRetries" type="number" min="0" step="1" value="2" />
            </label>
            <label>
              Context Window
              <input id="modelContextWindow" type="number" min="1" step="1" value="32768" />
            </label>
            <div class="model-actions">
              <label class="inline-check">
                <input id="clearApiKey" type="checkbox" />
                清空 API Key
              </label>
              <span class="model-key-state" id="modelKeyState">未读取</span>
              <button type="submit">保存模型</button>
            </div>
          </form>
        </div>
      </dialog>

      <div class="task-context-menu" id="taskContextMenu" role="menu" hidden>
        <button type="button" role="menuitem" data-context-action="rename">重命名</button>
        <button type="button" role="menuitem" data-context-action="archive">归档任务</button>
        <button type="button" role="menuitem" data-context-action="delete">删除任务</button>
      </div>

        <div class="welcome" id="welcome">
          <p class="welcome-brand">CodeMate</p>
          <h1>今天，我们一起完成什么？</h1>
          <p>从一个想法、一段代码，或一个待解决的问题开始。</p>
        </div>
        <section class="messages" id="messages" aria-live="polite" aria-label="消息"></section>

        <form class="composer" id="chatForm" aria-label="发送消息">
        <div class="project-picker" aria-label="当前项目">
          <span class="project-folder" aria-hidden="true">□</span>
          <span>开发对话</span>

        </div>
        <label class="message-label" for="messageInput">消息</label>
        <textarea id="messageInput" rows="4" placeholder="描述任务，或粘贴代码与报错信息…" required></textarea>
        <div class="composer-actions">

          <select
            class="composer-mode"
            id="operationModeSelect"
            aria-label="选择操作模式"
            title="当前 Web 页面仅提供对话；受控 Agent 执行请使用 codemate CLI"
          >
            <option value="chat">对话模式</option>
          </select>
          <select class="composer-model" id="composerModelSelect" aria-label="选择模型"></select>

          <p class="send-hint">Ctrl/⌘ + Enter</p>
          <button type="button" class="secondary icon-button" id="newSessionButton" hidden aria-label="新会话">＋</button>
          <button type="submit" class="icon-button send-button" id="sendButton" aria-label="发送">↑</button>
        </div>
        </form>
        <nav class="quick-prompts" aria-label="常用任务">
          <button type="button" data-prompt="总结本周项目进展，并列出下一步任务">◷ 周报总结</button>
          <button type="button" data-prompt="检查当前项目的错误并给出修复建议">☼ 报错修复</button>
          <button type="button" data-prompt="帮我制作一份项目介绍 PPT 的大纲">▣ PPT 制作</button>
          <button type="button" data-prompt="帮我把以下需求拆分为实现步骤和验证清单">◔ 拆解任务</button>
        </nav>
      </section>
    </main>

    <script src="/static/app.js?v=20260707-restore-main-selects" type="module"></script>
  </body>
</html>
